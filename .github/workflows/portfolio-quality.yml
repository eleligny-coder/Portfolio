name: Portfolio quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint, typecheck and build
        run: npm run check

      - name: Install Playwright test runtime
        run: npm install --no-save --package-lock=false @playwright/test@1.60.0

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npx playwright test

      - name: Install Lighthouse CI
        run: npm install --no-save --package-lock=false @lhci/cli@0.15.x

      - name: Run Lighthouse quality gates
        shell: bash
        run: |
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium executable available for Lighthouse CI"
            exit 1
          fi
          export CHROME_PATH
          npx lhci autorun --config=./lighthouserc.cjs
