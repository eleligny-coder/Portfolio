name: Portfolio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Run static export
        id: static_export
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat build.log
          exit 0

      - name: Upload build log on failure
        if: steps.static_export.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: static-export-log
          path: build.log
          retention-days: 3

      - name: Fail when static export failed
        if: steps.static_export.outputs.exit_code != '0'
        run: exit 1
